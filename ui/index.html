<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crux Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Vertical Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="btnNewTab" class="btn-new-tab">+ NEW TAB</button>
        <button id="btnToggleSidebar" class="btn-icon" title="Toggle Compact Mode">&lt;</button>
      </div>

      <div id="tabsList" class="tabs-list">
        <!-- Rendered dynamically with animations -->
      </div>

      <div class="sidebar-footer">
        <button id="btnAiSidebar" class="btn-footer">AI CHAT</button>
        <button id="btnBookmark" class="btn-footer">★ BOOKMARK</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-viewport">
      <!-- Top Navigation Bar -->
      <header class="top-nav">
        <div class="nav-buttons">
          <button id="btnBack" class="btn-nav" title="Back">&larr;</button>
          <button id="btnForward" class="btn-nav" title="Forward">&rarr;</button>
          <button id="btnReload" class="btn-nav" title="Reload">&#8635;</button>
        </div>

        <div class="url-bar-container">
          <input type="text" id="urlInput" class="url-input" placeholder="Search or enter address..." spellcheck="false">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="action-buttons">
          <button id="btnSplitView" class="btn-nav" title="Toggle Split View">SPLIT</button>
          <button id="btnReaderMode" class="btn-nav" title="Reading Mode">READ</button>
          <button id="btnSettings" class="btn-nav" title="Settings">⚙</button>
          <button id="btnCommandPalette" class="btn-nav" title="Command Palette (Ctrl+Shift+P)">CMD</button>
          <button id="btnToggleAi" class="btn-nav" title="Toggle Crux AI">AI</button>
        </div>
      </header>

      <!-- Web Content Viewport & AI Panel Wrapper -->
      <div class="workspace-wrapper">
        <section id="webViewContainer" class="webview-container">
          <iframe id="webFrame" src="https://duckduckgo.com" class="web-frame"></iframe>
          <iframe id="webFrameSplit" src="about:blank" class="web-frame hidden"></iframe>
        </section>

        <!-- Reader Mode Overlay -->
        <div id="readerOverlay" class="reader-overlay hidden">
          <div class="reader-header">
            <span id="readerTitle" class="reader-title">Reader Mode</span>
            <button id="btnCloseReader" class="btn-icon">&times;</button>
          </div>
          <article id="readerContent" class="reader-content">
            <p>Reader mode parses clean typography and distraction-free text.</p>
          </article>
        </div>

        <!-- Collapsible Crux AI Panel -->
        <aside id="aiPanel" class="ai-panel hidden">
          <div class="ai-header">
            <span class="ai-title">CRUX AI</span>
            <button id="btnCloseAi" class="btn-icon">&times;</button>
          </div>

          <div class="ai-controls">
            <label class="ai-lbl">MODEL:</label>
            <select id="aiModelSelect" class="ai-select">
              <option value="llama3">Ollama: llama3 (Local)</option>
              <option value="deepseek-r1">Ollama: deepseek-r1 (Local)</option>
              <option value="mistral">Ollama: mistral (Local)</option>
              <option value="deepseek-chat">DeepSeek V3 (Cloud)</option>
              <option value="gpt-4o-mini">OpenAI: GPT-4o Mini</option>
            </select>
          </div>

          <div id="aiChatHistory" class="ai-history">
            <div class="ai-msg system">Crux AI ready. Ask any question or summarize web pages.</div>
          </div>

          <div class="ai-actions-row">
            <button id="btnAiSummarize" class="btn-ai-action">SUMMARIZE PAGE</button>
            <button id="btnAiExplain" class="btn-ai-action">EXPLAIN</button>
          </div>

          <div class="ai-input-row">
            <input type="text" id="aiInput" class="ai-input" placeholder="Ask AI anything..." spellcheck="false">
            <button id="btnAiSend" class="btn-ai-send">SEND</button>
          </div>
        </aside>
      </div>
    </main>

    <!-- Command Palette Modal (Ctrl+Shift+P) -->
    <div id="commandPalette" class="modal-overlay hidden">
      <div class="palette-box">
        <input type="text" id="paletteInput" placeholder="Type a command or action..." autofocus>
        <ul id="paletteResults" class="palette-results">
          <!-- Commands dynamically rendered -->
        </ul>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
      <div class="settings-box">
        <div class="settings-header">
          <span class="settings-title">CRUX SETTINGS</span>
          <button id="btnCloseSettings" class="btn-icon">&times;</button>
        </div>
        <div class="settings-body">
          <div class="setting-item">
            <label class="setting-lbl">Default Search Engine</label>
            <select id="searchEngineSelect" class="settings-select">
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="searxng">SearXNG</option>
              <option value="brave">Brave Search</option>
            </select>
          </div>

          <div class="setting-item">
            <label class="setting-lbl">Ad & Tracker Blocker</label>
            <input type="checkbox" id="adblockToggle" checked>
            <span class="setting-desc">Filter telemetry and ad domains in Rust</span>
          </div>

          <div class="setting-item">
            <label class="setting-lbl">Download Directory</label>
            <div class="download-dir-row">
              <input type="text" id="txtDownloadDir" class="settings-input" placeholder="~/Downloads" readonly>
              <button id="btnBrowseDownload" class="btn-nav">Browse...</button>
            </div>
          </div>

          <div class="setting-item">
            <label class="setting-lbl">Crux AI API Key (OpenAI / DeepSeek)</label>
            <input type="password" id="txtAiApiKey" class="settings-input" placeholder="sk-...">
          </div>
        </div>
        <div class="settings-footer">
          <button id="btnSaveSettings" class="btn-new-tab">SAVE SETTINGS</button>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
