<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crux Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Vertical Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="btnNewTab" class="btn-new-tab" title="Create New Tab (Ctrl+T)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>NEW TAB</span>
        </button>
        <button id="btnToggleSidebar" class="btn-icon" title="Toggle Compact Mode">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>

      <div id="tabsList" class="tabs-list">
        <!-- Rendered dynamically with animations & icons -->
      </div>

      <div class="sidebar-footer">
        <button id="btnAiSidebar" class="btn-footer" title="Open AI Chat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
          <span>AI CHAT</span>
        </button>
        <button id="btnBookmark" class="btn-footer" title="Bookmark Page">
          <svg id="svgBookmarkIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>BOOKMARK</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-viewport">
      <!-- Top Navigation & Integrated Window Controls Bar -->
      <header id="dragRegion" class="top-nav">
        <div class="nav-buttons">
          <button id="btnBack" class="btn-nav" title="Back">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="btnForward" class="btn-nav" title="Forward">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button id="btnReload" class="btn-nav" title="Reload">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </div>

        <div class="url-bar-container">
          <input type="text" id="urlInput" class="url-input" placeholder="Search or enter address..." spellcheck="false">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="action-buttons">
          <button id="btnSplitView" class="btn-nav" title="Toggle Split View">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="0"/><path d="M12 3v18"/></svg>
            <span>SPLIT</span>
          </button>
          <button id="btnReaderMode" class="btn-nav" title="Distraction-Free Reading Mode">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>READ</span>
          </button>
          <button id="btnSettings" class="btn-nav" title="Settings">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="btnCommandPalette" class="btn-nav" title="Command Palette (Ctrl+Shift+P)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 3-3 3 3 3"/><path d="m6 9 3 3-3 3"/><path d="M21 15h-6"/><path d="M9 15H3"/></svg>
            <span>CMD</span>
          </button>
          <button id="btnToggleAi" class="btn-nav" title="Toggle Crux AI">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            <span>AI</span>
          </button>
        </div>

        <!-- Integrated Frameless Window Controls -->
        <div class="window-controls">
          <button id="btnWinMin" class="btn-win" title="Minimize">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button id="btnWinMax" class="btn-win" title="Maximize">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="5" y="5" rx="0"/></svg>
          </button>
          <button id="btnWinClose" class="btn-win close" title="Close">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </header>

      <!-- Web Content Viewport & AI Panel Wrapper -->
      <div class="workspace-wrapper">
        <section id="webViewContainer" class="webview-container">
          <iframe id="webFrame" src="https://duckduckgo.com" class="web-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; camera; microphone" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
          <iframe id="webFrameSplit" src="about:blank" class="web-frame hidden" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; camera; microphone" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <!-- Reader Mode Overlay -->
        <div id="readerOverlay" class="reader-overlay hidden">
          <div class="reader-header">
            <span id="readerTitle" class="reader-title">Reader Mode</span>
            <button id="btnCloseReader" class="btn-icon" title="Close Reader">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <article id="readerContent" class="reader-content">
            <p>Reader mode formats articles in distraction-free typography.</p>
          </article>
        </div>

        <!-- Collapsible Crux AI Panel -->
        <aside id="aiPanel" class="ai-panel hidden">
          <div class="ai-header">
            <span class="ai-title">CRUX AI</span>
            <button id="btnCloseAi" class="btn-icon" title="Close AI Panel">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div class="ai-controls">
            <label class="ai-lbl">MODEL:</label>
            <select id="aiModelSelect" class="ai-select">
              <option value="llama3">Ollama: llama3 (Local)</option>
              <option value="deepseek-r1">Ollama: deepseek-r1 (Local)</option>
              <option value="mistral">Ollama: mistral (Local)</option>
              <option value="deepseek-chat">DeepSeek V3 (Cloud)</option>
              <option value="gpt-4o-mini">OpenAI: GPT-4o Mini</option>
            </select>
          </div>

          <div id="aiChatHistory" class="ai-history">
            <div class="ai-msg system">Crux AI ready. Ask any question or summarize web pages.</div>
          </div>

          <div class="ai-actions-row">
            <button id="btnAiSummarize" class="btn-ai-action">SUMMARIZE PAGE</button>
            <button id="btnAiExplain" class="btn-ai-action">EXPLAIN</button>
          </div>

          <div class="ai-input-row">
            <input type="text" id="aiInput" class="ai-input" placeholder="Ask AI anything..." spellcheck="false">
            <button id="btnAiSend" class="btn-ai-send">SEND</button>
          </div>
        </aside>
      </div>
    </main>

    <!-- Command Palette Modal (Ctrl+Shift+P) -->
    <div id="commandPalette" class="modal-overlay hidden">
      <div class="palette-box">
        <input type="text" id="paletteInput" placeholder="Type a command or action..." autofocus>
        <ul id="paletteResults" class="palette-results">
          <!-- Commands dynamically rendered -->
        </ul>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
      <div class="settings-box">
        <div class="settings-header">
          <span class="settings-title">CRUX SETTINGS</span>
          <button id="btnCloseSettings" class="btn-icon" title="Close Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="settings-body">
          <div class="setting-item">
            <label class="setting-lbl">Default Search Engine</label>
            <select id="searchEngineSelect" class="settings-select">
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="searxng">SearXNG</option>
              <option value="brave">Brave Search</option>
            </select>
          </div>

          <div class="setting-item">
            <label class="setting-lbl">Ad & Tracker Blocker</label>
            <div class="setting-checkbox-row">
              <input type="checkbox" id="adblockToggle" checked>
              <span class="setting-desc">Filter telemetry and ad domains in Rust</span>
            </div>
          </div>

          <div class="setting-item">
            <label class="setting-lbl">Download Directory</label>
            <div class="download-dir-row">
              <input type="text" id="txtDownloadDir" class="settings-input" placeholder="~/Downloads" readonly>
              <button id="btnBrowseDownload" class="btn-nav">Browse...</button>
            </div>
          </div>

          <div class="setting-item">
            <label class="setting-lbl">Crux AI API Key (OpenAI / DeepSeek)</label>
            <input type="password" id="txtAiApiKey" class="settings-input" placeholder="sk-...">
          </div>
        </div>
        <div class="settings-footer">
          <button id="btnSaveSettings" class="btn-new-tab">SAVE SETTINGS</button>
        </div>
      </div>
    </div>

    <!-- Floating Toast Notification -->
    <div id="toastNotification" class="toast-notification hidden"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
