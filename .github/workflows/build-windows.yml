name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller zephyrium.spec --noconfirm --clean

      - name: Verify build artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/zephyrium/zephyrium.exe")) {
            Write-Error "zephyrium.exe was not created!"
            exit 1
          }
          Write-Host "Found dist/zephyrium/zephyrium.exe successfully."

      - name: Package portable ZIP and compute SHA-256
        shell: pwsh
        run: |
          $zipName = "zephyrium-windows-x86_64.zip"
          Compress-Archive -Path dist/zephyrium/* -DestinationPath dist/$zipName -Force
          $hash = (Get-FileHash -Algorithm SHA256 dist/$zipName).Hash
          Set-Content -Path dist/$zipName.sha256 -Value $hash
          Write-Host "Archive created: dist/$zipName"
          Write-Host "SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyrium-windows-x86_64
          path: |
            dist/zephyrium-windows-x86_64.zip
            dist/zephyrium-windows-x86_64.zip.sha256

      - name: Attach to GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zephyrium-windows-x86_64.zip
            dist/zephyrium-windows-x86_64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
