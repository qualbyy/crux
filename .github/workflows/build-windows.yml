name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
            pyinstaller crux.spec --noconfirm --clean

      - name: Verify build artifacts and smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/crux/crux.exe")) {
            Write-Error "crux.exe was not created!"
            exit 1
          }
          Write-Host "Found dist/crux/crux.exe successfully."
          # Run headless smoke test with --help to verify all DLLs (including QtCore) load without crashing
          $proc = Start-Process -FilePath "dist/crux/crux.exe" -ArgumentList "--help" -PassThru -Wait
          Write-Host "Smoke test process exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Smoke test failed! DLL or startup exception occurred."
            exit 1
          }

      - name: Package portable ZIP and compute SHA-256
        shell: pwsh
        run: |
          $zipName = "crux-windows-x86_64.zip"
          Compress-Archive -Path dist/crux/* -DestinationPath dist/$zipName -Force
          $hash = (Get-FileHash -Algorithm SHA256 dist/$zipName).Hash
          Set-Content -Path dist/$zipName.sha256 -Value $hash
          Write-Host "Archive created: dist/$zipName"
          Write-Host "SHA-256: $hash"

      - name: Build Windows Installer with Inno Setup
        shell: pwsh
        run: |
          # Download official Microsoft Visual C++ 2015-2022 Redistributable (x64)
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          iscc installer.iss
          $installerName = "crux-installer-windows-x86_64.exe"
          if (-not (Test-Path "dist/$installerName")) {
            Write-Error "Installer was not created!"
            exit 1
          }
          $instHash = (Get-FileHash -Algorithm SHA256 dist/$installerName).Hash
          Set-Content -Path dist/$installerName.sha256 -Value $instHash
          Write-Host "Installer created: dist/$installerName"
          Write-Host "SHA-256: $instHash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crux-windows-x86_64
          path: |
            dist/crux-installer-windows-x86_64.exe
            dist/crux-installer-windows-x86_64.exe.sha256
            dist/crux-windows-x86_64.zip
            dist/crux-windows-x86_64.zip.sha256

      - name: Attach to GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/crux-installer-windows-x86_64.exe
            dist/crux-installer-windows-x86_64.exe.sha256
            dist/crux-windows-x86_64.zip
            dist/crux-windows-x86_64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
