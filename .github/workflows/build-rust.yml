name: Crux 2.0 Rust CI

on:
  push:
    branches: [ rust-dev ]
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - '.github/workflows/build-rust.yml'
  pull_request:
    branches: [ rust-dev ]

jobs:
  build-linux:
    name: Build & Check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cargo Check
        run: |
          cd src-tauri
          cargo check --verbose

      - name: Cargo Build Release
        run: |
          cd src-tauri
          cargo build --release --verbose

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: crux-rs-linux-x86_64
          path: src-tauri/target/release/crux-rs
          if-no-files-found: error

  build-windows:
    name: Build & Check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cargo Check
        run: |
          cd src-tauri
          cargo check --verbose

      - name: Cargo Build Release
        run: |
          cd src-tauri
          cargo build --release --verbose

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: crux-rs-windows-x86_64
          path: src-tauri/target/release/crux-rs.exe
          if-no-files-found: error
