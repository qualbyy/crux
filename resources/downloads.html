<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crux://downloads</title>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-base: #18181b;
            --bg-surface: #262624;
            --bg-elevated: #2d2d2a;
            --border-muted: #3f3f46;
            --border-active: var(--accent, #a855f7);
            --text-primary: #d4d4d8;
            --text-bright: #f5f5f0;
            --text-muted: #71717a;
            --accent: #a855f7;
            --status-success: #10b981;
            --status-error: #ef4444;
            --font-mono: "Iosevka Nerd Font", "JetBrains Mono", monospace;
        }

        :root[data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-elevated: #f1f5f9;
            --border-muted: #cbd5e1;
            --border-active: var(--accent, #a855f7);
            --text-primary: #334155;
            --text-bright: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
            margin: 0;
            padding: 0;
            box-shadow: none !important;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 20px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 16px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-bright);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title span {
            color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-muted);
            color: var(--text-bright);
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-action:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .downloads-list {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-muted);
            background-color: var(--bg-surface);
        }

        .download-item {
            display: grid;
            grid-template-columns: 140px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--bg-elevated);
            transition: background-color 0.1s;
        }

        .download-item:last-child {
            border-bottom: none;
        }

        .download-item:hover {
            background-color: var(--bg-elevated);
        }

        .item-time {
            color: var(--text-muted);
            font-size: 11px;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .item-filename {
            color: var(--text-bright);
            font-weight: bold;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-meta {
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            gap: 12px;
        }

        .status-badge {
            font-weight: bold;
            padding: 2px 6px;
            font-size: 10px;
        }

        .status-completed {
            color: var(--status-success);
            border: 1px solid var(--status-success);
        }

        .status-error {
            color: var(--status-error);
            border: 1px solid var(--status-error);
        }

        .status-progress {
            color: #38bdf8;
            border: 1px solid #38bdf8;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            background: transparent;
            border: 1px solid var(--border-muted);
            color: var(--text-muted);
            font-size: 10px;
            padding: 5px 10px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-weight: bold;
        }

        .btn-sm:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty-state {
            padding: 48px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                ZEPHYRIUM <span>//</span> <span data-i18n="title_downloads">DOWNLOADS MANAGER</span>
            </div>
            <div class="actions">
                <button class="btn-action" onclick="openFolder()" data-i18n="btn_open_folder">OPEN DOWNLOADS FOLDER</button>
                <a href="crux://settings?tab=downloads" class="btn-action" data-i18n="btn_settings">SETTINGS</a>
                <button class="btn-action" style="border-color: var(--status-error); color: var(--status-error);" onclick="clearDownloads()" data-i18n="btn_clear_list">CLEAR LIST</button>
            </div>
        </div>

        <div id="downloadsList" class="downloads-list">
            <div class="empty-state" data-i18n="empty_loading">Loading downloads history...</div>
        </div>
    </div>

    <script>
        const I18N_DOWNLOADS = {
            ru: {
                title_downloads: "УПРАВЛЕНИЕ ЗАГРУЗКАМИ",
                btn_open_folder: "ОТКРЫТЬ ПАПКУ",
                btn_settings: "НАСТРОЙКИ",
                btn_clear_list: "ОЧИСТИТЬ СПИСОК",
                empty_loading: "Загрузка списка файлов...",
                empty_none: "Список загрузок пуст.",
                btn_open_file: "ОТКРЫТЬ ФАЙЛ",
                confirm_clear: "Очистить список загрузок? (Файлы на диске удалены не будут)",
                done: "[ГОТОВО]",
                failed: "[ОШИБКА]",
                downloading: "[СКАЧИВАЕТСЯ]"
            },
            en: {
                title_downloads: "DOWNLOADS MANAGER",
                btn_open_folder: "OPEN DOWNLOADS FOLDER",
                btn_settings: "SETTINGS",
                btn_clear_list: "CLEAR LIST",
                empty_loading: "Loading downloads history...",
                empty_none: "No downloads found.",
                btn_open_file: "OPEN FILE",
                confirm_clear: "Clear downloaded items list? (Downloaded files on disk will NOT be deleted)",
                done: "[DONE]",
                failed: "[FAILED]",
                downloading: "[DOWNLOADING]"
            }
        };

        let currentLang = 'ru';

        function applyLanguage(lang) {
            currentLang = lang || 'ru';
            const dict = I18N_DOWNLOADS[currentLang] || I18N_DOWNLOADS['en'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.textContent = dict[key];
                }
            });
            if (cachedDownloads.length > 0) renderItems(cachedDownloads);
        }
        window.applyLanguage = applyLanguage;

        let cachedDownloads = [];

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + (sizes[i] || 'TB');
        }

        function formatTimestamp(ts) {
            if (!ts) return "";
            const d = new Date(ts * 1000);
            return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        window.renderDownloads = function(items) {
            cachedDownloads = items || [];
            renderItems(cachedDownloads);
        };

        function renderItems(items) {
            const container = document.getElementById('downloadsList');
            container.innerHTML = '';
            const dict = I18N_DOWNLOADS[currentLang] || I18N_DOWNLOADS['en'];

            if (!items || items.length === 0) {
                container.innerHTML = `<div class="empty-state">${dict.empty_none}</div>`;
                return;
            }

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'download-item';
                const statusCls = item.state === 'completed' ? 'status-completed' : (item.state === 'error' ? 'status-error' : 'status-progress');
                const statusText = item.state === 'completed' ? dict.done : (item.state === 'error' ? dict.failed : dict.downloading);

                el.innerHTML = `
                    <div class="item-time">${formatTimestamp(item.timestamp)}</div>
                    <div class="item-details">
                        <span class="item-filename">${escapeHtml(item.filename)}</span>
                        <div class="item-meta">
                            <span class="status-badge ${statusCls}">${statusText}</span>
                            <span>${formatBytes(item.size)}</span>
                            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(item.path)}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-sm" onclick="openFile('${encodeURIComponent(item.path)}')">${dict.btn_open_file}</button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function sendToHost(url) {
            try {
                try { window.prompt("CRUX_CMD:" + url); } catch(e) { window.prompt("ZEPHYRIUM_CMD:" + url); }
            } catch (e) {
                console.log("CRUX_IPC:" + url);
            }
        }
        window.sendToHost = sendToHost;

        function openFile(encPath) {
            sendToHost(`crux://action/open-file?path=${encPath}`);
        }

        function openFolder() {
            sendToHost("crux://action/open-downloads-folder");
        }

        function clearDownloads() {
            const dict = I18N_DOWNLOADS[currentLang] || I18N_DOWNLOADS['en'];
            if (confirm(dict.confirm_clear)) {
                sendToHost("crux://action/clear-downloads");
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m];
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const themeParam = urlParams.get('theme');
            if (themeParam) document.documentElement.setAttribute('data-theme', themeParam);
            const accentParam = urlParams.get('accent');
            if (accentParam) document.documentElement.style.setProperty('--accent', accentParam);
            const langParam = urlParams.get('lang');
            if (langParam) applyLanguage(langParam);
        });
    </script>
</body>
</html>
