<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Sonde Minimalist Geometric Icon (Anthropic Minimal Dark / Sand Aesthetic) -->
  <rect x="0" y="0" width="128" height="128" fill="#121214"/>
  <rect x="0.5" y="0.5" width="127" height="127" fill="none" stroke="#27272a" stroke-width="1"/>
  <rect x="5.5" y="5.5" width="117" height="117" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.3"/>

  <defs>
    <linearGradient id="sondeSandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b98d"/>
      <stop offset="50%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b38356"/>
    </linearGradient>
    <linearGradient id="sondeCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf6ed"/>
    </linearGradient>
  </defs>

  <!-- Sonde 4-Pointed Star Cross (Pure geometry, sharp and recognizable) -->
  <path d="M 64 14 L 74 52 L 114 64 L 74 76 L 64 114 L 54 76 L 14 64 L 54 52 Z" 
        fill="url(#sondeSandGrad)" />

  <!-- Inner Diamond Core -->
  <polygon points="64,46 74,64 64,82 54,64" fill="url(#sondeCoreGrad)"/>

  <!-- Center Focal Dot -->
  <circle cx="64" cy="64" r="3.5" fill="#7c5332"/>
</svg>
