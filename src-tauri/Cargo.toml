[package]
name = "crux-rs"
version = "2.0.0-alpha.1"
description = "Crux Browser — Modern, privacy-first, engineer-centric browser"
edition = "2021"

[[bin]]
name = "crux-rs"
path = "src/main.rs"

[dependencies]
wry = "0.47"
tao = "0.30"
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json"] }
